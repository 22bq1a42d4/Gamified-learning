{% extends "base_auth.html" %}
{% load static %}

{% block content %}
<style>
    /* Design System Integration */
    .game-container {
        max-width: 1000px; margin: 0 auto;
        background: var(--surface); border-radius: 40px;
        border: 2px solid white; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.1);
        overflow: hidden;
    }
    .game-header { background: white; border-bottom: 1px solid var(--border-soft); padding: 1.5rem 2.5rem; }
    
    /* Forest Theme & XP Glow */
    #archerCanvas {
        background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), 
                    url('https://img.freepik.com/free-vector/nature-forest-landscape-background_1308-72431.jpg') no-repeat center center;
        background-size: cover; cursor: crosshair; display: block;
    }
    
    .math-overlay {
        background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
        padding: 1rem 2.5rem; border-radius: 50px; border: 2px solid var(--primary);
        box-shadow: 0 10px 25px rgba(46, 139, 87, 0.2);
    }

    #result-overlay {
        background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(20px);
        z-index: 100;
    }
</style>

<div class="game-container animate-in fade-in duration-700">
    <div class="game-header d-flex justify-content-between align-items-center">
        <div>
            <h2 class="heading-font text-2xl font-black text-gray-900 mb-0">{{ game.title }}</h2>
            <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">{{ game.subject.name }} • Mission Active</p>
        </div>
        <div class="flex gap-4">
            <div class="px-4 py-2 bg-blue-50 rounded-xl text-center border border-blue-100">
                <p class="text-[8px] font-black text-blue-400 uppercase mb-0">Score</p>
                <p id="score-val" class="font-black text-[var(--secondary)] mb-0">0</p>
            </div>
            <div class="px-4 py-2 bg-orange-50 rounded-xl text-center border border-orange-100">
                <p class="text-[8px] font-black text-orange-400 uppercase mb-0">XP Gain</p>
                <p class="font-black text-[var(--accent)] mb-0">+{{ game.xp_reward }}</p>
            </div>
        </div>
    </div>

    <div class="position-relative">
        <div class="position-absolute w-100 flex justify-center" style="top: 30px;">
            <div class="math-overlay">
                <h3 id="current-equation" class="heading-font text-2xl font-black text-gray-800 mb-0">Calculating Mission Parameters...</h3>
            </div>
        </div>

        <canvas id="archerCanvas" width="900" height="500" class="w-full"></canvas>

        <div id="result-overlay" class="position-absolute top-0 start-0 w-100 h-100 d-none flex-column align-items-center justify-content-center">
            <div class="text-center">
                <div class="w-24 h-24 bg-green-50 text-[var(--primary)] rounded-full flex items-center justify-center mx-auto mb-6 text-4xl shadow-lg">
                    <i class="fa-solid fa-trophy"></i>
                </div>
                <h1 class="heading-font text-4xl font-black text-gray-900 mb-2">Sector Secured!</h1>
                <p class="text-gray-500 font-medium mb-8">Mission objectives complete. You earned <span id="final-xp" class="text-[var(--accent)] font-black">0</span> XP.</p>
                <button onclick="submitGame()" class="btn-glow px-12 py-4 rounded-2xl text-xs font-black text-white uppercase tracking-widest">
                    Claim XP Rewards & Return
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('archerCanvas');
    const ctx = canvas.getContext('2d');
    let score = 0;
    const totalPossible = 5;
    let currentEq = { q: "", a: 0 };
    let gameActive = true;

    function generateEquation() {
        const a = Math.floor(Math.random() * 8) + 2;
        const x = Math.floor(Math.random() * 9) + 1;
        const b = Math.floor(Math.random() * 15);
        const result = (a * x) + b;
        currentEq = { q: `${a}x + ${b} = ${result}`, a: x };
        document.getElementById('current-equation').innerText = `Find x: ${currentEq.q}`;
    }

    class Target {
        constructor(value, x, y) {
            this.value = value; this.x = x; this.y = y;
            this.radius = 35; this.speed = 1.2 + Math.random();
        }
        draw() {
            ctx.shadowBlur = 15; ctx.shadowColor = "rgba(255, 165, 2, 0.6)";
            ctx.fillStyle = "#FFA502"; ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0; ctx.fillStyle = "white";
            ctx.font = "900 20px Inter"; ctx.textAlign = "center";
            ctx.fillText(this.value, this.x, this.y + 7);
        }
        update() { this.y += this.speed; if(this.y > canvas.height + 50) this.y = -50; }
    }

    const arrows = [];
    const targets = [];

    function spawnTargets() {
        targets.length = 0;
        const correctIdx = Math.floor(Math.random() * 3);
        for(let i=0; i<3; i++) {
            const val = (i === correctIdx) ? currentEq.a : currentEq.a + Math.floor(Math.random()*10) - 5;
            targets.push(new Target(val, 450 + (i * 180), Math.random() * -300));
        }
    }

    canvas.addEventListener('mousedown', (e) => {
        if(!gameActive) return;
        const rect = canvas.getBoundingClientRect();
        const angle = Math.atan2((e.clientY - rect.top) - 400, (e.clientX - rect.left) - 80);
        arrows.push({ x: 80, y: 400, angle: angle, speed: 12 });
    });

    function gameLoop() {
        if(!gameActive) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Draw Archer Base
        ctx.fillStyle = "#2E8B57";
        ctx.beginPath(); ctx.roundRect(40, 380, 60, 60, 15); ctx.fill();

        arrows.forEach((arrow, i) => {
            arrow.x += Math.cos(arrow.angle) * arrow.speed;
            arrow.y += Math.sin(arrow.angle) * arrow.speed;
            ctx.strokeStyle = "#4C6EF5"; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(arrow.x, arrow.y);
            ctx.lineTo(arrow.x - Math.cos(arrow.angle)*25, arrow.y - Math.sin(arrow.angle)*25);
            ctx.stroke();

            targets.forEach(t => {
                if(Math.hypot(arrow.x - t.x, arrow.y - t.y) < t.radius) {
                    if(t.value === currentEq.a) {
                        score++; document.getElementById('score-val').innerText = score;
                        if(score >= totalPossible) { gameActive = false; showResult(); }
                        else { generateEquation(); spawnTargets(); }
                    }
                    arrows.splice(i, 1);
                }
            });
        });

        targets.forEach(t => { t.update(); t.draw(); });
        requestAnimationFrame(gameLoop);
    }

    function showResult() {
        document.getElementById('result-overlay').classList.remove('d-none');
        document.getElementById('result-overlay').classList.add('d-flex');
        document.getElementById('final-xp').innerText = {{ game.xp_reward }};
    }

    function submitGame() {
        const data = new FormData();
        data.append('score', score);
        data.append('total_possible', totalPossible);
        data.append('csrfmiddlewaretoken', '{{ csrf_token }}');

        fetch("{% url 'games:play_game' game.id %}", {
            method: 'POST', body: data, headers: { 'X-Requested-With': 'XMLHttpRequest' }
        }).then(() => window.location.href = "{% url 'games:game_list' %}");
    }

    generateEquation(); spawnTargets(); gameLoop();
</script>
{% endblock %}
