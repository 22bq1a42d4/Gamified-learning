{% extends "base_auth.html" %}
{% load static %}

{% block content %}
<div class="container-fluid py-4 animate-in fade-in duration-700">
    <div class="max-w-5xl mx-auto">
        <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-3xl shadow-sm border border-gray-100">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-green-50 rounded-2xl flex items-center justify-center text-[var(--primary)]">
                    <i class="fa-solid fa-vial-circle-check fa-xl"></i>
                </div>
                <div>
                    <h2 class="text-xl font-bold text-gray-800">{{ game.title }}</h2>
                    <p class="text-xs text-gray-500 uppercase tracking-widest font-semibold">{{ game.subject.name }} • Sorting Mission</p>
                </div>
            </div>
            <div class="flex gap-3">
                <div class="px-4 py-2 bg-blue-50 text-[var(--secondary)] rounded-xl font-bold border border-blue-100">
                    <i class="fa-solid fa-star-half-stroke mr-2"></i>Target: <span id="target-count">5</span>
                </div>
                <div class="px-4 py-2 bg-orange-50 text-[var(--accent)] rounded-xl font-bold border border-orange-100">
                    <i class="fa-solid fa-bolt mr-2"></i>XP: {{ game.xp_reward }}
                </div>
            </div>
        </div>

        <div class="grid grid-cols-12 gap-6">
            <div class="col-span-4 bg-gray-50 p-6 rounded-[35px] border-2 border-dashed border-gray-200">
                <h4 class="text-center font-bold text-gray-400 mb-6 uppercase text-xs tracking-widest">Inventory</h4>
                <div id="source-container" class="space-y-4">
                    </div>
            </div>

            <div class="col-span-8 space-y-6">
                <div id="drop-zone-a" class="drop-target bg-white p-8 rounded-[35px] border-2 border-gray-100 shadow-sm text-center transition-all">
                    <div class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-4 border border-gray-100">
                        <i class="fa-solid fa-box-open text-gray-300 fa-lg"></i>
                    </div>
                    <h3 class="text-lg font-bold text-gray-700 mb-2" id="zone-a-label">Category A</h3>
                    <div class="flex flex-wrap justify-center gap-3 min-h-[80px] p-4 bg-slate-50 rounded-2xl border border-inner border-gray-100" id="target-a"></div>
                </div>

                <div id="drop-zone-b" class="drop-target bg-white p-8 rounded-[35px] border-2 border-gray-100 shadow-sm text-center transition-all">
                    <h3 class="text-lg font-bold text-gray-700 mb-2" id="zone-b-label">Category B</h3>
                    <div class="flex flex-wrap justify-center gap-3 min-h-[80px] p-4 bg-slate-50 rounded-2xl border border-inner border-gray-100" id="target-b"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="success-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
    <div class="bg-white rounded-[40px] p-10 max-w-sm w-full text-center shadow-2xl scale-in-center">
        <div class="w-24 h-24 bg-green-100 text-[var(--primary)] rounded-full flex items-center justify-center mx-auto mb-6 shadow-glow">
            <i class="fa-solid fa-trophy fa-3x"></i>
        </div>
        <h2 class="text-3xl font-black text-gray-800 mb-2">Excellent!</h2>
        <p class="text-gray-500 mb-8 font-medium">You’ve mastered this sorting challenge perfectly.</p>
        <button onclick="submitGame()" class="w-full py-4 bg-[var(--primary)] text-white rounded-2xl font-bold shadow-lg hover:translate-y-[-2px] transition-all">
            COLLECT {{ game.xp_reward }} XP <i class="fa-solid fa-arrow-right ml-2"></i>
        </button>
    </div>
</div>

<style>
    .draggable-item { cursor: grab; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    .draggable-item:active { cursor: grabbing; scale: 0.95; }
    .drop-target.drag-over { border-color: var(--primary); background: #f0fff4; scale: 1.02; }
    .shadow-glow { box-shadow: 0 0 30px rgba(46, 139, 87, 0.3); }
</style>

<script>
    // Logic for Sorting Game (Example: Organelle Sort - Plant vs Animal)
    const items = [
        { id: 1, name: 'Cell Wall', cat: 'A' },
        { id: 2, name: 'Centrioles', cat: 'B' },
        { id: 3, name: 'Large Vacuole', cat: 'A' },
        { id: 4, name: 'Chloroplast', cat: 'A' },
        { id: 5, name: 'Lysosomes', cat: 'B' }
    ];

    document.getElementById('zone-a-label').innerText = "Plant Cell";
    document.getElementById('zone-b-label').innerText = "Animal Cell";

    const source = document.getElementById('source-container');
    let score = 0;

    items.forEach(item => {
        const el = document.createElement('div');
        el.className = "draggable-item bg-white p-4 rounded-2xl shadow-sm border border-gray-100 font-bold text-gray-700 flex justify-between items-center";
        el.draggable = true;
        el.innerHTML = `${item.name} <i class="fa-solid fa-grip-vertical text-gray-300"></i>`;
        el.ondragstart = (e) => e.dataTransfer.setData('text', JSON.stringify(item));
        source.appendChild(el);
    });

    document.querySelectorAll('.drop-target').forEach(zone => {
        zone.ondragover = (e) => { e.preventDefault(); zone.classList.add('drag-over'); };
        zone.ondragleave = () => zone.classList.remove('drag-over');
        zone.ondrop = (e) => {
            zone.classList.remove('drag-over');
            const data = JSON.parse(e.dataTransfer.getData('text'));
            const targetId = zone.id === 'drop-zone-a' ? 'A' : 'B';
            
            if (data.cat === targetId) {
                score++;
                // UI feedback
                const tag = document.createElement('span');
                tag.className = "bg-[var(--primary)] text-white px-4 py-2 rounded-xl text-sm font-bold animate-bounce";
                tag.innerText = data.name;
                document.getElementById(zone.id === 'drop-zone-a' ? 'target-a' : 'target-b').appendChild(tag);
                // Remove from source logic...
                if (score === items.length) document.getElementById('success-modal').classList.remove('hidden');
            }
        };
    });

    function submitGame() {
        const formData = new FormData();
        formData.append('score', score);
        formData.append('total_possible', items.length);
        formData.append('csrfmiddlewaretoken', '{{ csrf_token }}');
        fetch("{% url 'games:play_game' game.id %}", { method: 'POST', body: formData, headers: {'X-Requested-With': 'XMLHttpRequest'} })
        .then(() => window.location.href = "{% url 'games:game_list' %}");
    }
</script>
{% endblock %}
